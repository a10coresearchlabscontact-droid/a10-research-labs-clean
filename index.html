<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-10 C.O. Research Labs — Intro Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.intro-screen{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;background:#000;display:flex;justify-content:center;align-items:center}
.intro-video{width:62vw;height:62vh;max-width:1100px;max-height:620px;object-fit:contain;background:#000;display:none}
.enter-button{padding:14px 34px;border:1px solid #5fdcff;border-radius:999px;background:rgba(0,20,45,.75);color:#fff;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;box-shadow:0 0 12px rgba(95,220,255,.8),inset 0 0 10px rgba(95,220,255,.35);transition:.25s ease}
.enter-button:hover{color:#5fdcff;box-shadow:0 0 20px rgba(95,220,255,1),0 0 40px rgba(95,220,255,.7)}
.home-test{width:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;background:radial-gradient(circle at 50% 35%,rgba(23,141,255,.18),transparent 35%),#020711;text-align:center;padding:40px}
.home-test img{width:min(520px,78vw);max-height:55vh;object-fit:contain;border-radius:24px}
.home-test p{color:#9eb3c7;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.status{color:#49e8ff;font-size:12px;letter-spacing:.08em}
</style>
</head>
<body>
<section class="intro-screen" id="introScreen">
<button id="enterButton" class="enter-button" type="button">ENTER A-10 C.O. RESEARCH LABS</button>
<video id="introVideo" class="intro-video" playsinline preload="auto">
<source src="a10-research-labs-intro.mp4" type="video/mp4">
</video>
</section>
<main class="home-test">
<img src="a10-logo.jpg" alt="A-10 C.O. Research Labs">
<p>Clean repository playback test</p>
<div class="status" id="statusText">Waiting for intro…</div>
</main>
<audio id="ambientAudio" loop preload="auto">
<source src="a10-labs-ambient-compatible.mp3" type="audio/mpeg">
</audio>
<script>
const enterButton=document.getElementById("enterButton");
const introVideo=document.getElementById("introVideo");
const introScreen=document.getElementById("introScreen");
const ambientAudio=document.getElementById("ambientAudio");
const statusText=document.getElementById("statusText");

function finishIntro(){
  introScreen.style.display="none";
  document.body.style.overflow="auto";
  if(!ambientAudio.paused){
    ambientAudio.volume=0.34;
    statusText.textContent="Intro OK · Ambient music ON";
  }else{
    statusText.textContent="Intro OK · Ambient music did not start";
  }
}

enterButton.addEventListener("click",()=>{
  enterButton.style.display="none";
  introVideo.style.display="block";
  introVideo.currentTime=0;
  introVideo.muted=false;
  ambientAudio.volume=0;

  const ambientPromise=ambientAudio.play();
  if(ambientPromise&&typeof ambientPromise.catch==="function"){
    ambientPromise.catch(error=>console.warn("Ambient audio start failed:",error));
  }

  const videoPromise=introVideo.play();
  if(videoPromise&&typeof videoPromise.catch==="function"){
    videoPromise.catch(error=>{
      console.error("Intro video start failed:",error);
      statusText.textContent="Intro video failed";
    });
  }
});

introVideo.addEventListener("ended",finishIntro);
introVideo.addEventListener("error",()=>{
  console.error("Could not load a10-research-labs-intro.mp4");
  statusText.textContent="Intro video file failed to load";
});
</script>
</body>
</html>
